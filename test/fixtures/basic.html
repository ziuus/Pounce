<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pounce fixture</title>
  </head>
  <body>
    <main>
      <h1>Basic fixture</h1>
      <button type="button">Save</button>
      <a href="/settings">Settings</a>
      <input type="text" aria-label="Search" placeholder="Search">
      <input type="checkbox" aria-label="Enable alerts">
      <select aria-label="Theme">
        <option>Light</option>
        <option>Dark</option>
      </select>
      <textarea aria-label="Notes"></textarea>
      <div role="button" tabindex="0">Custom action</div>
      <div role="link" tabindex="0">Custom link</div>
      <span hidden>Hidden target</span>
      <button type="button" disabled>Disabled target</button>
      <iframe src="frame.html" title="Fixture frame"></iframe>
    </main>
  </body>
</html>
